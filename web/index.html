<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <title>dsh-PEC</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <script>
    // Paint with the DSH theme before the first frame: the desktop choice is
    // cached by the app, `system` follows the phone's own preference.
    (function () {
      try {
        var pref = localStorage.getItem('ccdsh_theme') || 'system';
        var size = Number(localStorage.getItem('ccdsh_font_size') || 14);
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.body.setAttribute('data-ds-dark-theme', '');
        document.documentElement.style.setProperty('--dsh-content-font-size', (size || 14) + 'px');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#151517' : '#ffffff');
      } catch (error) { /* first paint without a cache is fine */ }
    })();
  </script>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot" id="boot">
      <div class="boot-logo">dsh-PEC</div>
      <div class="boot-text" id="boot-text">正在连接电脑…</div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
